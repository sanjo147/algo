# SanjoTracker dashboard theme (dark, locked). Based on Streamlit's
# financial-dashboard template; fonts are the built-in ones (no external requests).

[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#60A5FA"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
paddingTop = "1rem"
paddingBottom = "3rem"
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = ["#60A5FA", "#34D399", "#F87171", "#FBBF24", "#A78BFA", "#38BDF8", "#94A3B8", "#FB923C"]
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#F8FAFC"

[server]
headless = false

[browser]
gatherUsageStats = false
