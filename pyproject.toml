[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanjotracker"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["sanjotracker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]   # T20 = no bare print()

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
